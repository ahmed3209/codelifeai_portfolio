    <!-- Google Structured Data (Schema.org Organization & WebSite for Google Search indexing and Logo display) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://codelifeai.com/#organization",
            "name": "CodeLifeAI",
            "url": "https://codelifeai.com",
            "logo": {
              "@type": "ImageObject",
              "@id": "https://codelifeai.com/#logo",
              "url": "https://codelifeai.com/logo.png",
              "contentUrl": "https://codelifeai.com/logo.png",
              "caption": "CodeLifeAI Logo",
              "width": 512,
              "height": 512
            },
            "image": "https://codelifeai.com/og-image.png",
            "description": "CodeLifeAI is a high-velocity software engineering studio building modern web apps, mobile products, AI integrations, and scalable cloud systems.",
            "email": "contact@codelifeai.com",
            "sameAs": [
              "https://github.com/codelifeai",
              "https://linkedin.com/company/codelifeai"
            ],
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "email": "contact@codelifeai.com",
                "contactType": "customer support"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://codelifeai.com/#website",
            "url": "https://codelifeai.com",
            "name": "CodeLifeAI",
            "publisher": {
              "@id": "https://codelifeai.com/#organization"
            }
          }
        ]
      }
